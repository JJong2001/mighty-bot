plugins {
    id 'java-library'
}

group = 'local.mighty'
def engineSource = file('src/mighty/ApplicationInfo.java').getText('UTF-8')
def versionMatch = engineSource =~ /VERSION\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"/
if (!versionMatch.find()) throw new GradleException('Missing engine version')
version = versionMatch.group(1)

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// 기존 패키지 위치를 유지해 소스와 대국 데이터를 불필요하게 옮기지 않는다.
sourceSets {
    main.java.srcDirs = ['src']
    test.java.srcDirs = ['test']
    test.resources.srcDirs = ['test/fixtures']
}

def lombokVersion = '1.18.48'

dependencies {
    // Lombok은 컴파일 시 코드를 생성하며, 실행 의존성에는 포함하지 않는다.
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
    workingDir = projectDir
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'java.awt.headless', 'true'
    maxParallelForks = 1
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// 검사를 통과한 실행 파일만 기존 실행 버튼에 연결한다.
tasks.register('activate') {
    dependsOn tasks.test, tasks.assemble
    inputs.file(tasks.jar.archiveFile)
    outputs.file(layout.buildDirectory.file(tasks.jar.archiveFileName.get()))
    outputs.file(layout.buildDirectory.file('active-jar.txt'))
    doLast {
        copy {
            from tasks.jar.archiveFile
            into layout.buildDirectory
        }
        layout.buildDirectory.file('active-jar.txt').get().asFile.setText(tasks.jar.archiveFileName.get() + '\n', 'US-ASCII')
    }
}

tasks.named('build') {
    dependsOn tasks.named('activate')
    // 로컬 화면 모듈이 있을 때만 함께 검사합니다. 공유 저장소에서는 엔진만 빌드합니다.
    if (findProject(':localDesktop') != null) {
        dependsOn ':localDesktop:check'
    }
}

tasks.named('wrapper') {
    gradleVersion = '9.8.2'
    distributionType = Wrapper.DistributionType.BIN
}

// 기존 개발 명령도 전체 현행 엔진의 표준 검사와 연결합니다.
tasks.register('basicRoundTest') {
    description = '공통 엔진의 전체 JUnit 검사를 실행합니다.'
    group = 'verification'
    dependsOn tasks.test
}

tasks.register('runBasicRound', JavaExec) {
    description = '선택한 현재 AI 정책으로 로컬 자동 대국을 실행합니다.'
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'mighty.simulation.BasicRoundDemo'
    systemProperty 'file.encoding', 'UTF-8'
    args providers.gradleProperty('seed').orElse('1').get(), providers.gradleProperty('policy').orElse('strategic').get()
}

// 로컬 엔진과 테이블탑 연결을 모두 검증한 결과에서 Windows 배포 파일을 만듭니다.
tasks.register('releaseBot', Exec) {
    group = 'distribution'
    description = '테이블탑 연결을 검사하고 자동 업데이트 파일과 Windows ZIP을 생성합니다.'
    dependsOn tasks.named('build'), ':bridge:check', ':launcher:jar'
    def packager = file('../bot/package_bot.ps1')
    def jdk = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    doFirst {
        // Windows PowerShell은 자체 기본 모듈 경로를 사용합니다.
        getEnvironment().remove('PSModulePath')
        commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', packager.absolutePath, '-Jdk', jdk.get().metadata.installationPath.asFile.absolutePath,
            '-UseBuiltJars'
    }
}
